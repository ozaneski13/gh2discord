[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gh2discord"
version = "0.1.1"
description = "One-command GitHub to Discord notifications: manage repo webhooks that post straight to your Discord channels."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ozan Eski" }]
keywords = ["github", "discord", "webhook", "notifications", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Communications :: Chat",
]

[project.urls]
Homepage = "https://github.com/ozaneski13/gh2discord"
Issues = "https://github.com/ozaneski13/gh2discord/issues"

[project.scripts]
gh2discord = "gh2discord.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/gh2discord"]
