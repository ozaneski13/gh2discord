name: release-dryrun

on: workflow_dispatch

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r .github/requirements/build.txt
      - run: python -m build --no-isolation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
          release-signing-artifacts: false
      - name: every dist file has a signature
        run: |
          ls -l dist/
          for f in dist/*.whl dist/*.tar.gz; do
            test -s "$f.sigstore.json" || { echo "missing signature for $f"; exit 1; }
          done

  verify:
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: artifacts survived the upload/download round trip
        run: |
          ls -l dist/
          test -n "$(find dist -name 'gh2discord-*.whl')" || { echo "wheel missing"; exit 1; }
          test -n "$(find dist -name 'gh2discord-*.tar.gz')" || { echo "sdist missing"; exit 1; }
      - name: wheel installs and the CLI runs
        run: |
          python -m pip install --quiet dist/gh2discord-*.whl
          gh2discord --version
