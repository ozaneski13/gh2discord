name: publish

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r .github/requirements/build.txt
      - run: python -m build --no-isolation
      - name: package version matches the tag
        run: |
          test -f "dist/gh2discord-${GITHUB_REF_NAME#v}.tar.gz" || { echo "dist/ does not match tag $GITHUB_REF_NAME"; ls dist; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
          release-signing-artifacts: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed
          path: dist/

  draft:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed
          path: dist/
      - name: every dist file has a signature
        run: |
          for f in dist/*.whl dist/*.tar.gz; do
            test -s "$f.sigstore.json" || { echo "missing signature for $f"; exit 1; }
          done
      - name: create the draft release with the signed dists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          existing=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == env.GITHUB_REF_NAME) | .id')
          test -z "$existing" || { echo "::error::a release or draft for $GITHUB_REF_NAME already exists (ids: $existing); delete it first"; exit 1; }
          obj=$(gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type + " " + .object.sha')
          if [ "${obj%% *}" = tag ]; then
            gh api "repos/$GH_REPO/git/tags/${obj##* }" --jq .message > notes.md
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "gh2discord ${GITHUB_REF_NAME#v}" "${notes[@]}" \
            || { gh release delete "$GITHUB_REF_NAME" --yes || true; exit 1; }

  pypi:
    needs: draft
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: publish the draft release once it is complete
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ids=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft and .tag_name == env.GITHUB_REF_NAME) | .id')
          test "$(printf '%s\n' "$ids" | grep -c .)" -eq 1 || { echo "::error::expected exactly one draft for $GITHUB_REF_NAME, got: $ids"; exit 1; }
          complete=$(gh api "repos/$GH_REPO/releases/$ids" --jq '[.assets[] | select(.state == "uploaded") | .name] as $n | [$n[] | select(endswith(".whl") or endswith(".tar.gz"))] as $d | ($d | any(endswith(".whl"))) and ($d | any(endswith(".tar.gz"))) and ($d | all(. as $f | any($n[]; . == ($f + ".sigstore.json"))))')
          test "$complete" = true || { echo "::error::draft $ids is missing a dist or a signature"; exit 1; }
          gh api -X PATCH "repos/$GH_REPO/releases/$ids" -F draft=false --jq '"published \(.html_url) immutable=\(.immutable)"'
